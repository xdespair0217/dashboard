<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星聯 & 尚鵬 售服體系人事戰情看板</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --tag-direct: #10b981;
      --tag-indirect: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 24px; }
    .header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .title h1 { font-size: 22px; font-weight: 700; color: #fff; }
    .title p { font-size: 13px; color: var(--text-sub); margin-top: 4px; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; }
    .search-box { background: var(--card-bg); border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 6px; color: #fff; width: 220px; outline: none; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-sub); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    .filter-btn.active, .filter-btn:hover { background: #2563eb; color: #fff; border-color: #2563eb; }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 16px; border-radius: 8px; }
    .stat-label { font-size: 12px; color: var(--text-sub); text-transform: uppercase; }
    .stat-val { font-size: 24px; font-weight: 700; color: var(--accent-blue); margin-top: 6px; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .staff-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    .staff-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .staff-name { font-size: 16px; font-weight: 700; color: #fff; }
    .staff-title { font-size: 13px; color: var(--accent-blue); margin-top: 2px; }
    .tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    .tag-dir { background: rgba(16, 185, 129, 0.15); color: var(--tag-direct); border: 1px solid var(--tag-direct); }
    .tag-indir { background: rgba(245, 158, 11, 0.15); color: var(--tag-indirect); border: 1px solid var(--tag-indirect); }
    .staff-body { font-size: 12px; color: var(--text-sub); line-height: 1.6; }
    .staff-footer { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 12px; }
    .email-link { color: var(--accent-blue); text-decoration: none; word-break: break-all; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">
      <h1>售服體系・組織編制與人事監控</h1>
      <p>涵蓋南港、內湖、板橋、北投、松江各廠在職名冊與直間接人員配置</p>
    </div>
    <div class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="搜尋姓名 / 職稱 / 廠區..." oninput="render()">
    </div>
  </div>

  <div class="controls" style="margin-bottom: 20px;">
    <button class="filter-btn active" onclick="setPlant('ALL', this)">全部廠區</button>
    <button class="filter-btn" onclick="setPlant('南港廠', this)">南港廠</button>
    <button class="filter-btn" onclick="setPlant('內湖廠', this)">內湖廠</button>
    <button class="filter-btn" onclick="setPlant('板橋廠', this)">板橋廠</button>
    <button class="filter-btn" onclick="setPlant('北投廠', this)">北投廠</button>
    <button class="filter-btn" onclick="setPlant('松江廠', this)">松江廠</button>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">當前顯示編制</div>
      <div class="stat-val" id="totalCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">直接生產人力 (技術/鈑烤)</div>
      <div class="stat-val" id="directCount" style="color: var(--tag-direct);">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">間接管理/支援 (接待/零件/出納)</div>
      <div class="stat-val" id="indirectCount" style="color: var(--tag-indirect);">0</div>
    </div>
  </div>

  <div class="grid-container" id="cardContainer"></div>

      { plant: "松江廠", name: "陳奕翔", title: "實習生", type: "直", subType: "引", email: "yisiang_chen@starunited.tw", empId: "SU00077" }
    ];

    let currentPlant = 'ALL';

    function setPlant(p, btn) {
      currentPlant = p;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function render() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      const filtered = staffData.filter(s => {
        const matchPlant = currentPlant === 'ALL' || s.plant === currentPlant;
        const matchKey = !keyword || s.name.toLowerCase().includes(keyword) || s.title.toLowerCase().includes(keyword) || s.plant.toLowerCase().includes(keyword) || (s.empId && s.empId.toLowerCase().includes(keyword));
        return matchPlant && matchKey;
      });

      const container = document.getElementById('cardContainer');
      container.innerHTML = '';

      let direct = 0, indirect = 0;

      filtered.forEach(s => {
        if (s.type === '直') direct++; else indirect++;
        const isDirect = s.type === '直';
        const tagClass = isDirect ? 'tag-dir' : 'tag-indir';
        const tagLabel = isDirect ? `直接人力 (${s.subType})` : `間接管理 (${s.subType})`;

        const card = document.createElement('div');
        card.className = 'staff-card';
        card.innerHTML = `
          <div>
            <div class="staff-header">
              <div>
                <div class="staff-name">${s.name}</div>
                <div class="staff-title">${s.plant} · ${s.title}</div>
              </div>
              <span class="tag ${tagClass}">${tagLabel}</span>
            </div>
            <div class="staff-body">
              <div>員工編號：${s.empId || '-'}</div>
            </div>
          </div>
          <div class="staff-footer">
            <a class="email-link" href="mailto:${s.email}">${s.email || '-'}</a>
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('totalCount').innerText = filtered.length;
      document.getElementById('directCount').innerText = direct;
      document.getElementById('indirectCount').innerText = indirect;
    }

    render();
  </script>
</body>
</html>
