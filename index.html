    :root {

      --text-sub: #8ea0be;
      --accent-blue: #38bdf8;
      --tag-direct: #10b981;
      --tag-indirect: #f59e0b;
      --tag-intern: #ec4899;
      --badge-bg: #1e293b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 24px;
    }
    .header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .title h1 {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .title p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 4px;
    }
    
    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 8px;
      color: #fff;
      width: 260px;
      outline: none;
      font-size: 14px;
      transition: all 0.2s;
    }
    .search-box:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
    }

    .filter-section {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .filter-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      min-width: 80px;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      color: #fff;
      border-color: var(--accent-blue);
    }
    .filter-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }
    .filter-btn.active-role {
      background: #0284c7;
      color: #fff;
      border-color: #0284c7;
    }
    .filter-btn.active-intern {
      background: var(--tag-intern);
      color: #fff;
      border-color: var(--tag-intern);
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 14px 18px;
      border-radius: 10px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 600;
    }
    .stat-val {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent-blue);
      margin-top: 4px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .staff-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }
    .staff-card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .staff-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .staff-name-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .staff-name {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
    }
    .emp-id-badge {
      background: var(--badge-bg);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .staff-title {
      font-size: 13px;
      color: var(--accent-blue);
      margin-top: 4px;
      font-weight: 600;
    }
    
    .tags-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
    }
    .tag-dir {
      background: rgba(16, 185, 129, 0.15);
      color: var(--tag-direct);
      border: 1px solid var(--tag-direct);
    }
    .tag-indir {
      background: rgba(245, 158, 11, 0.15);
      color: var(--tag-indirect);
      border: 1px solid var(--tag-indirect);
    }
    .tag-intern {
      background: rgba(236, 72, 153, 0.2);
      color: var(--tag-intern);
      border: 1px solid var(--tag-intern);
    }

      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.8;
    }

      align-items: center;

      padding-top: 10px;

      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .email-link {
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 12px;
      word-break: break-all;

    let currentPlant = 'ALL';
    let currentCategory = 'ALL';

    function setPlant(p, btn) {
      currentPlant = p;
      btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      btn.parentElement.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active-role');
        b.classList.remove('active-intern');
      });
      if (cat === '實習生') {
        btn.classList.add('active-intern');
      } else {
        btn.classList.add('active-role');
      }
      render();
    }

    function render() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      
      const filtered = staffData.filter(s => {
        const matchPlant = (currentPlant === 'ALL' || s.plant === currentPlant);
        const matchCat = (currentCategory === 'ALL' || s.category === currentCategory);
        const matchKey = !keyword || 
          s.name.toLowerCase().includes(keyword) || 
          s.title.toLowerCase().includes(keyword) || 
          s.plant.toLowerCase().includes(keyword) || 
          s.empId.toLowerCase().includes(keyword) ||
          s.dept.toLowerCase().includes(keyword);
        
        return matchPlant && matchCat && matchKey;
      });

      const container = document.getElementById('cardContainer');
      container.innerHTML = '';

      let direct = 0, indirect = 0, interns = 0;

      filtered.forEach(s => {
        if (s.type === '直') direct++; else indirect++;
        if (s.category === '實習生') interns++;

        const isDirect = s.type === '直';
        const isIntern = s.category === '實習生';
        
        const tagTypeClass = isDirect ? 'tag-dir' : 'tag-indir';
        const tagTypeLabel = isDirect ? `直接人力 (${s.subType})` : `間接管理 (${s.subType})`;

        const card = document.createElement('div');
        card.className = 'staff-card';
        card.innerHTML = `
          <div>
            <div class="staff-header">
              <div>
                <div class="staff-name-wrap">
                  <span class="staff-name">${s.name}</span>
                  <span class="emp-id-badge">${s.empId || '無員編'}</span>
                </div>
                <div class="staff-title">${s.plant} · ${s.title}</div>
              </div>
              <div class="tags-container">
                <span class="tag ${tagTypeClass}">${tagTypeLabel}</span>
                ${isIntern ? '<span class="tag tag-intern">🎓 實習生</span>' : ''}
              </div>
            </div>
            <div class="staff-body">
              <div class="staff-row-info">📍 部門：${s.dept || s.plant}</div>
              <div class="staff-row-info">📅 到職：${s.hireDate || '資料未建'}</div>
            </div>
          </div>
          <div class="staff-footer">
            <span>✉️</span>
            ${s.email ? `<a class="email-link" href="mailto:${s.email}">${s.email}</a>` : '<span style="color:#64748b;">未提供信箱</span>'}
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById('totalCount').innerText = filtered.length;
      document.getElementById('directCount').innerText = direct;
      document.getElementById('indirectCount').innerText = indirect;
      document.getElementById('internCount').innerText = interns;
    }

    // 初始化渲染
    render();
  </script>
